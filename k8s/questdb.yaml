# =====================================================================
# Deploiement QuestDB sur Kubernetes
# Application :  kubectl apply -f k8s/questdb.yaml
# Acces local  :  kubectl -n bigdata port-forward svc/questdb 9000:9000 8812:8812 9009:9009
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: bigdata
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: questdb-config
  namespace: bigdata
data:
  # Variables lues par l'image QuestDB (prefixe QDB_ -> server.conf)
  QDB_TELEMETRY_ENABLED: "false"
  QDB_SHARED_WORKER_COUNT: "2"
---
apiVersion: v1
kind: Secret
metadata:
  name: questdb-pg
  namespace: bigdata
type: Opaque
stringData:
  QDB_PG_USER: admin
  QDB_PG_PASSWORD: quest
---
apiVersion: v1
kind: Service
metadata:
  name: questdb
  namespace: bigdata
  labels:
    app: questdb
spec:
  # Service "headless" requis par le StatefulSet pour une identite stable
  clusterIP: None
  selector:
    app: questdb
  ports:
    - name: http
      port: 9000
      targetPort: 9000
    - name: postgres
      port: 8812
      targetPort: 8812
    - name: ilp
      port: 9009
      targetPort: 9009
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: questdb
  namespace: bigdata
spec:
  serviceName: questdb
  replicas: 1
  selector:
    matchLabels:
      app: questdb
  template:
    metadata:
      labels:
        app: questdb
    spec:
      containers:
        - name: questdb
          image: questdb/questdb:8.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
            - name: postgres
              containerPort: 8812
            - name: ilp
              containerPort: 9009
          envFrom:
            - configMapRef:
                name: questdb-config
            - secretRef:
                name: questdb-pg
          volumeMounts:
            - name: questdb-data
              mountPath: /var/lib/questdb
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: questdb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
